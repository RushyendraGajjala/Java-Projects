<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Second Application</title>
</head>
<body bgcolor="olivegreen" style="align-content: center; margin-left: auto; margin-right: auto; width: 500px;">
	<h1>Welcome to our second webapp</h1>
	<h2>Kindly register to proceed further</h2>
	<form method="POST" action="./registration">
		<table>
			<tr>
				<td>User name</td>

			<tr>
				<td>User city</td>
				<td><input type="text" name="ucity"></td>
			</tr>
			<tr>
				<td><input type="submit" value="signup"></td>
			</tr>
		</table>
	</form>
</body>
</html>

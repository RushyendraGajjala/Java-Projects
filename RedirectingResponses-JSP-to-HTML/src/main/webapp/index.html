<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
	</head>
	<body bgcolor="#f3c9d5" style="align-content: center; width: 50%; margin: 100px auto; font-family: sans-serif; text-align: center;">
		<div style="color: #3f2622;">
			<h1>Welcome to our second web-app</h1>
			<h2>Kindly register to proceed further!</h2>
		</div>
		
		<form action="./register" method="post" style="margin: 70px 0px; background: #3f2622; padding: 30px 0px; border-radius: 17px;">
					<span style="color: #f3c9d5;"><b>USERNAME:</b></span>
					<input style="border-radius: 6px; height: 22px; width: 150px; border-style: none; outline: none; box-shadow: none; color: #3f2622; font-weight: 600;" type="text" name="uname">
					<br><br>
					<span style="color: #f3c9d5;"><b>USER CITY :</b></span>
					<input style="border-radius: 6px; height: 22px; width: 150px; border-style: none; outline: none; box-shadow: none; color: #3f2622; font-weight: 600;" type="text" name="ucity">
			<div style="text-align: center; padding: 30px 0px">
				<button type="submit" style="font-weight: bold; padding: 10px 20px; border-width: 0px; border-radius: 7px; background-color: #f3c9d5; color: #3f2622;">
					Sign Up
				</button>
			</div>
		</form>
	</body>
</html>
